# upload-artifact/download-artifact actions are used to pass files between jobs
# a cache is mainly for performance
# an artifact is mainly for transfer/sharing

name: 08-Artifacts
on:
  workflow_dispatch:

jobs:
  artifact-producer:
    runs-on: ubuntu-24.04

    steps:
      # create a txt file to be stored as an artifact
      - name: Create artifact file
        run: |
          echo "This will be stored as an artifact!" > artifact.txt
          echo "Generated by artifact-producer job on $(date)" >> artifact.txt

      # upload the artifact to be used by other jobs
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-artifact
          path: artifact.txt

  artifact-consumer:
    runs-on: ubuntu-24.04
    needs: artifact-producer

    steps:
      # download the artifact created by the producer job
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-artifact

      # view the contents of the downloaded artifact file
      - name: View artifact file
        run: cat artifact.txt
