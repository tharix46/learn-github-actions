name: 10-GitHub-Token-Permissions
on:
  workflow_dispatch:

################
# GitHub automatically creates a short-lived token for every workflow run.
# Steps use this token to interact with the GitHub API
# Default permissions of automatically generated GITHUB_TOKEN are:
################
# permissions:
#   contents: read
#   packages: read
################

################
# All Permission Types
################
# permissions:
#   actions: read|write|none
#   attestations: read|write|none
#   checks: read|write|none
#   contents: read|write|none
#   deployments: read|write|none
#   id-token: write|none
#   issues: read|write|none
#   models: read|none
#   discussions: read|write|none
#   packages: read|write|none
#   pages: read|write|none
#   pull-requests: read|write|none
#   security-events: read|write|none
#   statuses: read|write|none
################

jobs:
  read-only-pr:
    runs-on: ubuntu-24.04

    # avoids failing entire workflow
    continue-on-error: true

    permissions:
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the first 5 open PRs (allowed)
        run: gh pr list --limit 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt to add a label (expected to fail)
        run: gh pr edit 4 --add-label "documentation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the failure
        if: failure() # runs the step if an earlier step has failed
        run: echo "❌  Write operation was blocked as expected - token is read-only."

  read-write-pr:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Attempt to add a label (expected to succeed)
        run: gh pr edit 4 --add-label "documentation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the success
        if: success()
        run: echo "✅ Write operation succeeded!"
