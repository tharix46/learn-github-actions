name: 15-Notification

on:
  # workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # build job
  demo-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Build Step
        run: |
          echo "Building the app ..."
          echo "Demo error to test failure notification"
          exit 1

  # deploy job
  demo-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Deploy Step
        run: echo "Deploying the app ..."

  # failure notification job
  failure-notification:
    needs: [demo-build, demo-deploy]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify Slack on failure
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ *GitHub Actions Failure*\n*Workflow:* $GITHUB_WORKFLOW\n*Repo:* $GITHUB_REPOSITORY\n*Branch:* ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\n*Triggered by:* $GITHUB_ACTOR\n*Event:* $GITHUB_EVENT_NAME\n*Run URL:* $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\'
