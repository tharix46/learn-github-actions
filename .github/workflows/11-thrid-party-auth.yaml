# GITHUB_TOKEN is for authenticate on behalf of Github Actions to perform tasks such as
# cloning, reading PRs, creating issues, and more.
#
# to authenticate to third-party services,
# you can use the OIDC token to request a short-lived access token from the third-party service at runtime.

name: 11-Third-Party-Auth
on:
  workflow_dispatch:

jobs:
  # ❌ DO NOT USE THIS APPROACH!
  auth-to-aws-access-key:
    runs-on: ubuntu-24.04

    steps:
      - name: "Configure AWS Credentials using access key"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS Login
        run: aws sts get-caller-identity
