name: 03-Job-Execution-Order

on:
  workflow_dispatch:

jobs:
  # job-1 has multiple steps and runs in parallel with job-2.
  job-1:
    runs-on: ubuntu-latest

    steps:
      - run: echo "A job consists of one or more steps"
      - run: echo "which run sequentially"
      - run: echo "within the same compute environment"

  # job-2 runs in parallel with job-1.
  job-2:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Multiple jobs can run in parallel"

  # job-3 depends on job-1 and job-2.
  job-3:
    runs-on: ubuntu-latest

    needs:
      - job-1
      - job-2
    steps:
      - run: echo "They can also depend on one another..."

  # job-4 depends on job-2 and job-3.
  job-4:
    runs-on: ubuntu-latest

    needs:
      - job-2
      - job-3
    steps:
      - run: echo "...to form a directed acyclic graph (DAG)"
