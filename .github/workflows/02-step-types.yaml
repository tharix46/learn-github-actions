name: 02-Step-Types

on: workflow_dispatch

jobs:
  # say hello using inline bash
  say-hello-inline-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Run a one-line bash
        run: echo "Hello from an inline bash script in a GitHub Action workflow!"

  # say hello using python shell
  say-hello-inline-python:
    runs-on: ubuntu-latest

    steps:
      - name: Run a one-line python
        run: print("Hello from an inline python script in a GitHub Action workflow!")
        shell: python

  # say hello using a javascript action
  say-hello-action-javascript:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello via a Javascript Action
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: "Everyone"
