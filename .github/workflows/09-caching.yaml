# cache is for speed. artifacts are for outputs.

name: 09-Caching
on:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # generic cache with actions/cache.
  # You decide what files/folders to save from a previous run and reuses them in later runs.
  # it speeds up workflows by avoiding repeated work like:
  # - installing dependencies
  # - building large assets
  # - downloading packages
  # - regenerating files
  # good for any project, custom build outputs, dependencies, etc.
  # ──────────────────────────────────────────────
  actions-cache:
    runs-on: ubuntu-24.04

    steps:
      # attempt to restore (misses on first run)
      - name: Restore cache
        id: demo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo-cache
          key: demo-cache-v1

      # populate directory only on miss
      - name: Populate cache directory
        if: ${{ steps.demo-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "Cache miss - generating contents"
          mkdir -p demo-cache
          date > demo-cache/timestamp.txt

      # save cache only if the cache was not restored (missed)
      - name: Save cache
        if: ${{ steps.demo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demo-cache
          key: demo-cache-v1

      - name: Verify cache status
        run: |
          echo "cache-hit? -> ${{ steps.demo-cache.outputs.cache-hit }}"
          cat demo-cache/timestamp.txt

  # ──────────────────────────────────────────────
  # cache via actions/setup-node
  # special-purpose cache for Node.js dependencies
  # ──────────────────────────────────────────────
  node-cache:
    runs-on: ubuntu-24.04

    defaults:
      # every "run:" command in this job will execute from this directory unless overridden.
      # e.g.,: npm ci will run in 04-advanced-features/caching/minimal-node-project
      run:
        working-directory: caching/minimal-node-project

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@d7a11313b581b306c961b506cfc8971208bb03f6 # v4.4.0
        with:
          node-version: 20
          cache: npm
          # point cache action at the specific lock-file file
          cache-dependency-path: caching/minimal-node-project/package-lock.json

      - name: Install dependencies
        # --prefer-offline = use cached packages first before downloading
        # --no-audit = skip security audit during install to save time
        run: npm ci --prefer-offline --no-audit

      - name: List first few modules
        run: ls -R node_modules | head
